# Netlify. Launch: build with PUBLIC=1 and delete the X-Robots-Tag header below (see vite.config.ts).
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# game assets (GLB models, textures) keep their names between versions: a day's cache, not forever
[[headers]]
  for = "/assets/*.glb"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/sky/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/retro/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# the build's JavaScript and CSS are content-hashed: cache forever
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/textures/*.ktx2"
  [headers.values]
    Content-Type = "image/ktx2"

# the texture decoder (a third-party build that only changes with three.js) and the UI art
[[headers]]
  for = "/basis/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/ui/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/og*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Art & Design pages (dist/art/**/index.html): always revalidate, like the game's page
[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
# Unknown addresses get dist/404.html with a 404 status (Netlify and Vercel both serve it by default).

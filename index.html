<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%SHARE_TITLE%</title>
    <meta name="description" content="%SHARE_DESCRIPTION%" />
    <!-- share:private — removed by the build when PUBLIC=1 (see vite.config.ts). Keeps search engines out; link
         previews don't index, so they still work. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="application-name" content="Bitbound" />
    <meta name="apple-mobile-web-app-title" content="Bitbound" />
    <meta name="theme-color" content="#1d3550" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph: Slack, iMessage and SMS previews, Discord, LinkedIn, Facebook, WhatsApp, Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bitbound" />
    <meta property="og:title" content="%SHARE_TITLE%" />
    <meta property="og:description" content="%SHARE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SHARE_IMAGE_ALT%" />
    <!-- a square image for apps that show square thumbnails (listed second, so the wide one is the default) -->
    <meta property="og:image" content="%SITE_URL%/og-square.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="%SHARE_IMAGE_ALT%" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SHARE_TITLE%" />
    <meta name="twitter:description" content="%SHARE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <meta name="twitter:image:alt" content="%SHARE_IMAGE_ALT%" />

    <!-- icons and the web app manifest -->
    <link rel="icon" href="%BASE%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE%favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE%site.webmanifest" />

    <script type="application/ld+json">%SHARE_JSONLD%</script>

    <!-- the loader: plain HTML and CSS, so it is on screen with the first paint, before any script runs
         (src/ui/Loader.tsx drives its bar and removes it once the world is ready) -->
    <style>
      html, body { margin: 0; background: #0d0b1e; }
      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: radial-gradient(ellipse at 30% 20%, #1d3550 0%, #0d0b1e 70%); color: #e6f0ff; font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif; transition: opacity 0.5s ease, visibility 0.5s; }
      #boot.boot--out { opacity: 0; visibility: hidden; }
      #boot .boot__box { display: grid; justify-items: center; gap: 18px; width: min(360px, 80vw); }
      #boot .boot__pip { width: 72px; height: 72px; image-rendering: pixelated; animation: bootBob 1.1s ease-in-out infinite alternate; }
      #boot .boot__word { font: 900 34px 'Outfit', ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.06em; }
      #boot .boot__word b { color: #ff9a3c; font-weight: 900; }
      #boot .boot__word span { color: #6fe3ff; }
      #boot .boot__bar { width: 100%; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      #boot .boot__fill { height: 100%; width: 4%; border-radius: 3px; background: linear-gradient(90deg, #ff9a3c, #6fe3ff); transition: width 0.3s ease; }
      #boot .boot__label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(230, 240, 255, 0.7); min-height: 1.2em; }
      #boot .boot__retry { display: none; font-size: 14px; color: #ffcf6b; }
      #boot .boot__retry button { margin-left: 8px; font: inherit; color: #0d0b1e; background: #ffcf6b; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      @keyframes bootBob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { #boot .boot__pip { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking the first paint (the loader shows at once, in a fallback face until they swap in) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot__box">

eight="1" fill="#1b1f3a"/><rect x="4" y="4" width="1" height="1" fill="#6fe3ff"/><rect x="5" y="4" width="1" height="1" fill="#1b1f3a"/><rect x="6" y="4" width="1" height="1" fill="#1b1f3a"/><rect x="7" y="4" width="1" height="1" fill="#6fe3ff"/><rect x="8" y="4" width="1" height="1" fill="#1b1f3a"/><rect x="9" y="4" width="1" height="1" fill="#1b1f3a"/><rect x="10" y="4" width="1" height="1" fill="#ff9a3c"/><rect x="1" y="5" width="1" height="1" fill="#ff9a3c"/><rect x="2" y="5" width="1" height="1" fill="#1b1f3a"/><rect x="3" y="5" width="1" height="1" fill="#1b1f3a"/><rect x="4" y="5" width="1" height="1" fill="#6fe3ff"/><rect x="5" y="5" width="1" height="1" fill="#1b1f3a"/><rect x="6" y="5" width="1" height="1" fill="#1b1f3a"/><rect x="7" y="5" width="1" height="1" fill="#6fe3ff"/><rect x="8" y="5" width="1" height="1" fill="#1b1f3a"/><rect x="9" y="5" width="1" height="1" fill="#1b1f3a"/><rect x="10" y="5" width="1" height="1" fill="#ff9a3c"/><rect x="1" y="6" width="1" height="1" fill="#ff9a3c"/><rect x="2" y="6" width="1" height="1" fill="#1b1f3a"/><rect x="3" y="6" width="1" height="1" fill="#1b1f3a"/><rect x="4" y="6" width="1" height="1" fill="#1b1f3a"/><rect x="5" y="6" width="1" height="1" fill="#1b1f3a"/><rect x="6" y="6" width="1" height="1" fill="#1b1f3a"/><rect x="7" y="6" width="1" height="1" fill="#1b1f3a"/><rect x="8" y="6" width="1" height="1" fill="#1b1f3a"/><rect x="9" y="6" width="1" height="1" fill="#1b1f3a"/><rect x="10" y="6" width="1" height="1" fill="#ff9a3c"/><rect x="1" y="7" width="1" height="1" fill="#ff9a3c"/><rect x="2" y="7" width="1" height="1" fill="#1b1f3a"/><rect x="3" y="7" width="1" height="1" fill="#1b1f3a"/><rect x="4" y="7" width="1" height="1" fill="#1b1f3a"/><rect x="5" y="7" width="1" height="1" fill="#1b1f3a"/><rect x="6" y="7" width="1" height="1" fill="#1b1f3a"/><rect x="7" y="7" width="1" height="1" fill="#1b1f3a"/><rect x="8" y="7" width="1" height="1" fill="#1b1f3a"/><rect x="9" y="7" width="1" height="1" fill="#         <div class="boot__word"><b>BIT</b><span>BOUND</span></div>
        <div class="boot__bar"><div class="boot__fill"></div></div>
        <div class="boot__label">Loading</div>
        <div class="boot__retry">Something didn't load. <button type="button" onclick="location.reload()">Retry</button></div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <h1>Bitbound</h1>
      <p>%SHARE_DESCRIPTION%</p>
      <p>Bitbound needs JavaScript and WebGL 2, and plays with a keyboard or a gamepad.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
